[package]
name = "syntra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic Syntra v1 protocol core: Frame codec, validation, handshake, RPC correlation. No Tinkle application types."
rust-version.workspace = true
publish = false

[dependencies]
prost.workspace = true
prost-types.workspace = true
bytes.workspace = true
thiserror.workspace = true
# Minimal tokio features for wasm32 compat (sync/time/rt/macros cover
# sync primitives, timeouts, spawn, select!). Native lib needs no more;
# tests/examples get `full` via dev-dependencies unification where needed.
# Previously `tokio.workspace = true` pulled `full` (mio/net) which breaks
# wasm32-unknown-unknown (mio unsupported). Same for tokio-util `full`
# (net). CancellationToken needs no tokio-util features.
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
futures-util.workspace = true
futures-channel.workspace = true
tracing.workspace = true
tinklecorp_syntra_community_neoeinstein-prost.workspace = true

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:tokio", "dep:tokio-util"]
