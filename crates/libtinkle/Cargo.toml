[package]
name = "libtinkle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tinkle client runtime over Syntra (typed RPCs, sync, reconnect)."
rust-version.workspace = true
# Git-only distribution: crates.io rejects crates depending on the
# buf-registry BSR bindings, so nothing in this workspace is published.
# Consumers depend via git; release-plz cuts tags + GitHub releases.
publish = false

[dependencies]
syntra-core.workspace = true
syntra-runtime.workspace = true
syntra-ws.workspace = true
tinkle-schema.workspace = true
prost.workspace = true
prost-types.workspace = true
futures-util.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
url.workspace = true
zeroize.workspace = true
async-trait.workspace = true

# Native keeps full tokio/tokio-util (unchanged behavior).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tinkle-storage.workspace = true

# WASM: reduced tokio (no mio/net) + minimal tokio-util (CancellationToken
# needs no features). Required so libtinkle (and libtinkle-web) compile for
# wasm32-unknown-unknown. rand/getrandom js support is enabled transitively
# via libtinkle-web's `getrandom` with `js` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.26" }
futures-util = "0.3"
anyhow = "1"
