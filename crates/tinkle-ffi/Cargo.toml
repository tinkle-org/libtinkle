[package]
name = "tinkle-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI facade over libtinkle for iOS (Swift) and Android (Kotlin)."
rust-version.workspace = true
publish = false

[lib]
name = "tinkle_ffi"
crate-type = ["lib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
libtinkle = { path = "../libtinkle" }
tinkle-storage.workspace = true
syntra-core.workspace = true
tinkle-schema.workspace = true
uniffi.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
prost.workspace = true
