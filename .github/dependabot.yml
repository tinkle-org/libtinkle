version: 2
registries:
  buf-public:
    type: cargo-registry
    registry: buf
    url: https://buf.build/gen/cargo/public/
    # Anonymous registry: declare the host for Dependabot's egress allowlist,
    # but do not invent a token (config.json has auth-required=false).
updates:
  - package-ecosystem: cargo
    directory: /
    registries:
      - buf-public
    schedule:
      interval: weekly
    groups:
      syntra-lockstep:
        patterns:
          - syntra-core
          - syntra-runtime
          - syntra-ws
    # .cargo/config.toml remains the source of Cargo's sparse index URL.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Add Gradle only when this repository actually contains a Gradle manifest.
