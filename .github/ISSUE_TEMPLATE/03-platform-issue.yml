name: Platform issue (iOS / Android / Web)
description: Rust native runtime, UniFFI adapter, lifecycle, storage, push, or portable WASM issue.
title: "[Platform]: "
labels: ["platform", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for UniFFI / wasm-bindgen surface, mobile lifecycle, storage, push, or build issues.
        Core protocol bugs go in Bug report. Redact all secrets.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Rust native runtime
        - UniFFI adapter contract
        - Web / WASM (wasm-bindgen, browser)
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      multiple: true
      options:
        - Boundary contract (UniFFI exports / portable WASM exports)
        - Async runtime (Tokio, future ownership, cancellation, callbacks)
        - Lifecycle (suspend / resume / reconnect / push wake)
        - Storage (CursorStore / SQLite / protected-store contract)
        - Push (APNs / FCM / WorkManager / Doze)
        - TCP establishment / provisioned trust
        - Rust compilation / dependency resolution / target wasm32
        - App binary size / startup / perf
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Behaviour on device/simulator/emulator/browser vs expected. Include OS version, device, and lifecycle state (foreground/background/wake).
      placeholder: |
        iOS simulator library: foreground connect succeeds, but resume after suspension does not restore subscriptions...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro / build steps
      description: Include Rust repro commands and the exact source revision. Consumer integrations need separate evidence.
      placeholder: |
        ```sh
        cargo check --locked -p tinkle-ffi
        cargo check --locked -p tinkle-schema -p libtinkle-web --target wasm32-unknown-unknown
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Toolchain pins that matter for bindings.
      placeholder: |
        libtinkle git sha:
        rustc --version --verbose:
        uniffi version:
        Xcode + native target + deployment target:
        Android NDK + ABI + minimum API:
        Browser + wasm-bindgen / wasm-pack version:
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Redacted device logs, Logcat/Console output, or browser console. No tokens or raw frames.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I redacted all secrets and did not log ClientHello / Frame bytes
          required: true
        - label: Native code has no browser-only APIs and wasm code has no raw sockets / blocking std::net (cfg boundary intact)
          required: false
