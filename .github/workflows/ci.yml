name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: 'Immutable source SHA supplied by the native release workflow'
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1
concurrency:
  group: rust-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || inputs.source_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo test --locked --workspace --all-features --verbose
      - if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - if: matrix.os == 'ubuntu-latest'
        name: Generated binding parity
        run: bash scripts/generate-bindings.sh --check
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo check --locked -p syntra-ws -p libtinkle-web --target wasm32-unknown-unknown
  msrv:
    # Required context is still `msrv (cargo-hack)` (see branch ruleset
    # `Protect main - require PR + CI`). Implementation checks the declared
    # workspace MSRV with that exact compiler instead of only `cargo hack
    # --rust-version`; keep the legacy name until the ruleset is migrated to
    # `Declared MSRV`.
    name: msrv (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve workspace MSRV and check with the declared compiler
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          data = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          versions = {p['rust_version'] for p in data['packages'] if p['id'] in data['workspace_members']}
          assert len(versions) == 1, 'Workspace members must declare one MSRV'
          version = versions.pop()
          assert version and re.fullmatch(r'\d+\.\d+(?:\.\d+)?', version)
          # Fetch using the pinned modern Cargo. The MSRV compiler never makes
          # registry/SSH requests, and optional CLI features stay disabled.
          subprocess.run(['cargo', 'fetch', '--locked'], check=True)
          subprocess.run(['rustup', 'toolchain', 'install', version, '--profile', 'minimal'], check=True)
          subprocess.run(['cargo', '+' + version, 'check', '--locked', '--offline', '--workspace', '--all-targets'], check=True)
          PY
