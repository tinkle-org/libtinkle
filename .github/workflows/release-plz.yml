name: Release-plz
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-plz
  cancel-in-progress: false
jobs:
  release-plz:
    name: Release-plz (git-only releases + PR)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Run release-plz (publish=false policy in workspace manifests)
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
